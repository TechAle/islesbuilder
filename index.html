<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Character Build Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">

    <div class="left-panel">

        <!-- Equipment Grid Panel -->
        <section class="equip-panel">
            <button type="button" class="section-toggle section-toggle--panel" data-collapse="equip-content" aria-expanded="true">
                <span>⚔️ Equipment</span>
                <span class="section-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="equip-content" class="section-content">
            <div class="equip-grid">

                <!-- Weapon -->
                <div class="equip-slot">
                    <div class="equip-icon">⚔️</div>
                    <div class="equip-details">
                        <span class="equip-title">Weapon</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="weapon" list="list-weapon" placeholder="Cerca o inserisci...">
                            <datalist id="list-weapon"></datalist>
                            <button class="btn-edit" data-slot="weapon" title="Modifica / Custom">⚙️</button>
                        </div>
                        <div class="augments-container">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 1" data-augment-slot="weapon" data-aug-index="0">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 2" data-augment-slot="weapon" data-aug-index="1">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 3" data-augment-slot="weapon" data-aug-index="2">
                        </div>
                    </div>
                </div>

                <!-- Glove -->
                <div class="equip-slot">
                    <div class="equip-icon">🧤</div>
                    <div class="equip-details">
                        <span class="equip-title">Glove</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="glove" list="list-glove" placeholder="Cerca o inserisci...">
                            <datalist id="list-glove"></datalist>
                            <button class="btn-edit" data-slot="glove" title="Modifica / Custom">⚙️</button>
                        </div>
                    </div>
                </div>

                <!-- Helmet -->
                <div class="equip-slot">
                    <div class="equip-icon">🪖</div>
                    <div class="equip-details">
                        <span class="equip-title">Helmet</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="helmet" list="list-helmet" placeholder="Cerca o inserisci...">
                            <datalist id="list-helmet"></datalist>
                            <button class="btn-edit" data-slot="helmet" title="Modifica / Custom">⚙️</button>
                        </div>
                        <div class="augments-container">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 1" data-augment-slot="helmet" data-aug-index="0">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 2" data-augment-slot="helmet" data-aug-index="1">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 3" data-augment-slot="helmet" data-augment-slot="helmet" data-aug-index="2">
                        </div>
                    </div>
                </div>

                <!-- Amulet -->
                <div class="equip-slot">
                    <div class="equip-icon">📿</div>
                    <div class="equip-details">
                        <span class="equip-title">Amulet</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="amulet" list="list-amulet" placeholder="Cerca o inserisci...">
                            <datalist id="list-amulet"></datalist>
                            <button class="btn-edit" data-slot="amulet" title="Modifica / Custom">⚙️</button>
                        </div>
                    </div>
                </div>

                <!-- Chestplate -->
                <div class="equip-slot">
                    <div class="equip-icon">🛡️</div>
                    <div class="equip-details">
                        <span class="equip-title">Chestplate</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="chestplate" list="list-chestplate" placeholder="Cerca o inserisci...">
                            <datalist id="list-chestplate"></datalist>
                            <button class="btn-edit" data-slot="chestplate" title="Modifica / Custom">⚙️</button>
                        </div>
                        <div class="augments-container">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 1" data-augment-slot="chestplate" data-aug-index="0">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 2" data-augment-slot="chestplate" data-aug-index="1">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 3" data-augment-slot="chestplate" data-aug-index="2">
                        </div>
                    </div>
                </div>

                <!-- Ring 1 -->
                <div class="equip-slot">
                    <div class="equip-icon">💍</div>
                    <div class="equip-details">
                        <span class="equip-title">Ring 1</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="ring1" list="list-ring1" placeholder="Cerca o inserisci...">
                            <datalist id="list-ring1"></datalist>
                            <button class="btn-edit" data-slot="ring1" title="Modifica / Custom">⚙️</button>
                        </div>
                    </div>
                </div>

                <!-- Leggings -->
                <div class="equip-slot">
                    <div class="equip-icon">👖</div>
                    <div class="equip-details">
                        <span class="equip-title">Leggings</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="leggings" list="list-leggings" placeholder="Cerca o inserisci...">
                            <datalist id="list-leggings"></datalist>
                            <button class="btn-edit" data-slot="leggings" title="Modifica / Custom">⚙️</button>
                        </div>
                        <div class="augments-container">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 1" data-augment-slot="leggings" data-aug-index="0">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 2" data-augment-slot="leggings" data-aug-index="1">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 3" data-augment-slot="leggings" data-aug-index="2">
                        </div>
                    </div>
                </div>

                <!-- Ring 2 -->
                <div class="equip-slot">
                    <div class="equip-icon">💍</div>
                    <div class="equip-details">
                        <span class="equip-title">Ring 2</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="ring2" list="list-ring2" placeholder="Cerca o inserisci...">
                            <datalist id="list-ring2"></datalist>
                            <button class="btn-edit" data-slot="ring2" title="Modifica / Custom">⚙️</button>
                        </div>
                    </div>
                </div>

                <!-- Boots -->
                <div class="equip-slot">
                    <div class="equip-icon">🥾</div>
                    <div class="equip-details">
                        <span class="equip-title">Boots</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="boots" list="list-boots" placeholder="Cerca o inserisci...">
                            <datalist id="list-boots"></datalist>
                            <button class="btn-edit" data-slot="boots" title="Modifica / Custom">⚙️</button>
                        </div>
                        <div class="augments-container">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 1" data-augment-slot="boots" data-aug-index="0">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 2" data-augment-slot="boots" data-aug-index="1">
                            <input type="text" class="augment-input" list="list-augments" placeholder="Augment 3" data-augment-slot="boots" data-aug-index="2">
                        </div>
                    </div>
                </div>

                <!-- Feet -->
                <div class="equip-slot">
                    <div class="equip-icon">🦶</div>
                    <div class="equip-details">
                        <span class="equip-title">Feet Slots</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="feet" list="list-feet" placeholder="Cerca o inserisci...">
                            <datalist id="list-feet"></datalist>
                            <button class="btn-edit" data-slot="feet" title="Modifica / Custom">⚙️</button>
                        </div>
                    </div>
                </div>

                <!-- Core -->
                <div class="equip-slot">
                    <div class="equip-icon round">🔮</div>
                    <div class="equip-details">
                        <span class="equip-title">Core</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="core" list="list-core" placeholder="Cerca o inserisci...">
                            <datalist id="list-core"></datalist>
                            <button class="btn-edit" data-slot="core" title="Modifica / Custom">⚙️</button>
                        </div>
                    </div>
                </div>

                <!-- Pets -->
                <div class="equip-slot">
                    <div class="equip-icon">🐾</div>
                    <div class="equip-details">
                        <span class="equip-title">Pets</span>
                        <div class="equip-controls">
                            <input type="text" class="item-input" data-slot="pets" list="list-pets" placeholder="Cerca o inserisci...">
                            <datalist id="list-pets"></datalist>
                            <button class="btn-edit" data-slot="pets" title="Modifica / Custom">⚙️</button>
                        </div>
                    </div>
                </div>

            </div>
            </div>
        </section>

        <!-- Elixirs Section -->
        <section class="elixirs-panel">
            <div class="section-title elixirs-title">
                <button type="button" class="section-toggle section-toggle--inline" data-collapse="elixirs-content" aria-expanded="true">
                    <span>🧪 Elixirs</span>
                    <span class="section-chevron" aria-hidden="true">▾</span>
                </button>
                <div class="elixir-bulk-actions">
                    <button type="button" class="btn-elixir-bulk" id="btn-elixir-max">Set Max</button>
                    <button type="button" class="btn-elixir-bulk" id="btn-elixir-zero">Set 0</button>
                </div>
            </div>
            <div id="elixirs-content" class="section-content">
                <div class="elixirs-grid" id="elixirs-container"></div>
            </div>
        </section>

        <!-- Skill Tree Section -->
        <section class="tree-panel">
            <button type="button" class="section-toggle section-toggle--panel" data-collapse="tree-content" aria-expanded="true">
                <span>🌳 Skill Tree</span>
                <span class="section-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="tree-content" class="section-content tree-content">
            <nav class="class-selector">
                <button class="class-btn" data-class="warrior">Warrior</button>
                <button class="class-btn active" data-class="archer">Archer</button>
                <button class="class-btn" data-class="mage">Mage</button>
            </nav>
            <div class="tree-viewport">
                <svg id="wires" viewBox="0 0 1000 620" preserveAspectRatio="none"></svg>
                <div class="nodes" id="nodes"></div>
            </div>
            <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted);">
                <span>SP Rimanenti: <input type="number" id="points" class="points-input" min="0" step="1" value="100"></span>
                <span>Click: Potenzia | Shift+Click: Depotenzia</span>
            </div>
            </div>
        </section>

    </div>

    <!-- RIGHT: DETAILED & DAMAGE (30%) -->
    <div class="right-panel">
        <div id="top" class="output-card full-height">
            <div class="damage-header">
                <button type="button" class="section-toggle section-toggle--card" data-collapse="damage-content" aria-expanded="true">
                    <span>Damage Overview</span>
                    <span class="section-chevron" aria-hidden="true">▾</span>
                </button>
            </div>
            <div id="damage-content" class="section-content output-content">
            <div class="damage-view-tabs" role="tablist">
                <button type="button" class="damage-view-tab active" data-damage-view="overview" role="tab">Damage Overview</button>
                <button type="button" class="damage-view-tab" data-damage-view="enemy" role="tab">Enemy Simulator</button>
            </div>
            <div id="damage-overview-view" class="damage-view-panel">
            <div class="damage-highlight">
                <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase;">Average DPS</div>
                <div class="damage-dps" id="damage-dps">—</div>
                <div class="damage-breakdown" id="damage-breakdown" hidden></div>
            </div>
            <div class="damage-uptime" id="grief-uptime-control" hidden>
                <label class="damage-uptime-label" for="grief-uptime">Grief uptime</label>
                <input type="range" class="damage-uptime-slider" id="grief-uptime" min="1" max="100" step="1" value="100">
                <span class="damage-uptime-value" id="grief-uptime-value">100%</span>
            </div>
            <div class="damage-uptime" id="last-sorrow-uptime-control" hidden>
                <label class="damage-uptime-label" for="last-sorrow-uptime">Last Sorrow uptime</label>
                <input type="range" class="damage-uptime-slider" id="last-sorrow-uptime" min="1" max="100" step="1" value="100">
                <span class="damage-uptime-value" id="last-sorrow-uptime-value">100%</span>
            </div>
            <div class="damage-uptime" id="focus-stacks-control" hidden>
                <label class="damage-uptime-label" for="focus-stacks">Focus Stacks</label>
                <input type="range" class="damage-uptime-slider" id="focus-stacks" min="0" max="3" step="0.1" value="0">
                <span class="damage-uptime-value" id="focus-stacks-value">0 / 3</span>
            </div>
            <div class="damage-uptime" id="potential-charge-kills-control" hidden>
                <label class="damage-uptime-label" for="potential-charge-kills">Kills</label>
                <input type="range" class="damage-uptime-slider" id="potential-charge-kills" min="0" max="30" step="1" value="0">
                <span class="damage-uptime-value" id="potential-charge-kills-value">0 / 30</span>
            </div>
            <div class="damage-uptime" id="crystal-explosions-control" hidden>
                <label class="setting-check">
                    <input type="checkbox" id="crystal-explosion-override"> Override explosions
                </label>
                <input type="range" class="damage-uptime-slider" id="crystal-explosions" min="0" max="4" step="0.1" value="0">
                <span class="damage-uptime-value" id="crystal-explosions-value">0 / 4</span>
            </div>
            <div class="damage-uptime" id="execution-hp-control" hidden>
                <label class="damage-uptime-label" for="execution-hp">Execution HP %</label>
                <input type="range" class="damage-uptime-slider" id="execution-hp" min="0" max="100" step="1" value="50">
                <span class="damage-uptime-value" id="execution-hp-value">50%</span>
            </div>
            <div class="damage-uptime" id="prosecution-hp-control" hidden>
                <label class="damage-uptime-label" for="prosecution-hp">Prosecution HP %</label>
                <input type="range" class="damage-uptime-slider" id="prosecution-hp" min="0" max="100" step="1" value="50">
                <span class="damage-uptime-value" id="prosecution-hp-value">50%</span>
            </div>
            <div class="damage-uptime" id="enraged-hp-control" hidden>
                <label class="damage-uptime-label" for="enraged-hp">Enraged HP %</label>
                <input type="range" class="damage-uptime-slider" id="enraged-hp" min="0" max="100" step="1" value="50">
                <span class="damage-uptime-value" id="enraged-hp-value">50%</span>
            </div>
            <div class="damage-uptime" id="infected-hits-control" hidden>
                <label class="damage-uptime-label" for="infected-hits">Infected hits</label>
                <input type="range" class="damage-uptime-slider" id="infected-hits" min="0" max="30" step="1" value="0">
                <span class="damage-uptime-value" id="infected-hits-value">Auto</span>
            </div>
            <div class="damage-uptime" id="deathburst-kills-control" hidden>
                <label class="damage-uptime-label" for="deathburst-kills">Kills / s</label>
                <input type="range" class="damage-uptime-slider" id="deathburst-kills" min="0" max="0.2" step="0.01" value="0.2">
                <span class="damage-uptime-value" id="deathburst-kills-value">0.5</span>
            </div>
            <div id="damage-settings" hidden>
                <div class="setting-row" id="setting-slow-attack-row">
                    <div class="setting-main">
                        <label class="setting-check">
                            <input type="checkbox" id="setting-slow-attack"> Slow attack
                        </label>
                        <input type="number" id="setting-slow-attack-value" class="setting-number" step="0.01" min="0.01" value="0.6" hidden disabled>
                    </div>
                    <span class="setting-help" tabindex="0" data-tooltip="If you are slow at attacking, check this and it will override attack interval">?</span>
                </div>
                <div class="setting-row" id="setting-use-burst-row">
                    <div class="setting-main">
                        <label class="setting-check">
                            <input type="checkbox" id="setting-use-burst"> Use burst
                        </label>
                    </div>
                    <span class="setting-help" tabindex="0" data-tooltip="If enabled, you will use the burst as soon as possible">?</span>
                </div>
                <div class="setting-row" id="setting-special-attacks" hidden>
                    <div class="setting-main setting-main--column" id="setting-special-attack-list"></div>
                    <span class="setting-help" tabindex="0" data-tooltip="Enable or disable each onClick special attack">?</span>
                </div>
            </div>
            <div id="damage-steps-container"></div>
            </div>
            <div id="damage-enemy-view" class="damage-view-panel" hidden>
                <div class="enemy-inputs">
                    <label class="enemy-input-row" for="enemy-preset">
                        <span>Monster</span>
                        <select id="enemy-preset"></select>
                    </label>
                    <label class="enemy-input-row" for="enemy-hp">
                        <span>Enemy HP</span>
                        <input type="number" id="enemy-hp" min="0" step="1" value="10000">
                    </label>
                    <label class="enemy-input-row" for="enemy-defense">
                        <span>Enemy Defense</span>
                        <input type="number" id="enemy-defense" min="0" step="1" value="0">
                    </label>
                    <label class="enemy-input-row" for="enemy-damage-percent">
                        <span>Damage%</span>
                        <input type="number" id="enemy-damage-percent" step="1" value="0">
                    </label>
                </div>
                <div id="enemy-results" class="enemy-results"></div>
            </div>
            </div>
        </div>

        <div id="bottom" class="output-card">
            <button type="button" class="section-toggle section-toggle--card" data-collapse="stats-content" aria-expanded="true">
                <span>Detailed Stats</span>
                <span class="section-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="stats-content" class="section-content output-content">
            <div id="detailed-stats-container"></div>
            <div class="action-buttons-group">
                <button class="btn-share" id="btn-share-build">🔗 Condividi Build</button>
                <button class="btn-paste" id="btn-paste-build">📋 Incolla Build</button>
            </div>
            </div>
        </div>
    </div>

</div>

<!-- MODAL EDITOR PER OGGETTI / STATISTICHE CUSTOM -->
<div class="modal-backdrop" id="modal-editor">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-slot-title">Modifica Oggetto</h3>
            <button class="btn-close-modal" style="background:none; border:none; color:#fff; cursor:pointer;">✕</button>
        </div>

        <div style="display:flex; flex-direction:column; gap:6px;">
            <label style="font-size:12px; color:var(--text-muted);">Nome Oggetto Base:</label>
            <input type="text" id="modal-item-name" style="background:var(--bg-main); border:1px solid var(--border-color); color:#fff; padding:6px; border-radius:4px;">
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="font-size:12px; color:var(--text-muted);">Statistiche Base:</label>
            <button class="btn-add-stat" id="btn-add-stat">+ Aggiungi Statistica</button>
        </div>

        <div class="stat-edit-list" id="modal-stat-list"></div>

        <div class="modal-footer">
            <button class="btn-action btn-cancel btn-close-modal">Annulla</button>
            <button class="btn-action btn-save" id="btn-save-modal">Salva Oggetto</button>
        </div>
    </div>
</div>

<!-- DATALIST SUGGERIMENTI -->
<datalist id="stat-suggestions">
</datalist>

<datalist id="list-augments-weapon">
</datalist>

<datalist id="list-augments-armor">
</datalist>

<div id="global-tooltip" class="global-tooltip" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
